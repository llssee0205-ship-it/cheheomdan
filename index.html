<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>체험단 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#eef0f7;font-family:'Noto Sans KR',sans-serif;color:#1a1c1e}

/* 스크롤 컨테이너 */
#vp{
  height:100dvh;
  overflow-y:scroll;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:110px;
  /* GPU 레이어로 올려서 스크롤 네이티브 처리 */
  transform:translateZ(0);
  will-change:scroll-position;
}
#vp::-webkit-scrollbar{display:none}

/* 헤더 */
#hdr{
  padding:48px 20px 16px;
  background:#eef0f7;
  transform:translateZ(0);
}
#hdr.up{
  transform:translateY(-100%) translateZ(0);
  transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);
}
#hdr.down{
  transform:translateY(0) translateZ(0);
  transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);
}

h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:14px}
h1 span{color:#0050cb}

/* 요약 3칸 */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.sum-item{background:#fff;border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;border:1px solid rgba(0,0,0,0.05)}
.sum-n{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;line-height:1;color:#0050cb}
.sum-n.gray{color:#bbb}
.sum-l{font-size:11px;color:#999;margin-top:3px;font-weight:500}
.sum-l.blue{color:#0050cb;font-weight:700}

/* 필터 — sticky */
#filters{
  position:sticky;
  top:0;
  z-index:50;
  background:#eef0f7;
  padding:10px 20px;
  /* blur 없이 단색 배경만 */
  transform:translateZ(0);
}
.filter-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fc{
  flex-shrink:0;
  padding:7px 16px;
  border-radius:99px;
  border:1.5px solid #dde0ef;
  background:#fff;
  color:#888;
  font-size:13px;font-weight:600;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  white-space:nowrap;
  /* 클릭 피드백만, transition 최소화 */
}
.fc.on{background:#1a1c1e;border-color:#1a1c1e;color:#fff}

/* 카드 리스트 */
#list{padding:6px 16px 0}

/* 스와이프 래퍼 */
.sw{position:relative;overflow:hidden;border-radius:20px;margin-bottom:10px}
.sw-acts{
  position:absolute;right:0;top:0;bottom:0;
  display:flex;align-items:stretch;
  opacity:0;pointer-events:none;
  border-radius:0 20px 20px 0;overflow:hidden;
}
.sw.open .sw-acts{opacity:1;pointer-events:all}
.sw-btn{
  width:66px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  border:none;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  font-size:11px;font-weight:700;
}

/* 카드 */
.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  border:1px solid rgba(0,0,0,0.05);
  /* transform은 JS에서 */
  will-change:transform;
}
.card.dim{opacity:0.55}

/* 카드 상단 */
.card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.thumb{
  width:50px;height:50px;border-radius:12px;
  background:#f0f0f0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border:1px solid rgba(0,0,0,0.06);
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .material-symbols-outlined{font-size:24px;color:#ccc}
.card-info{flex:1;min-width:0}
.card-src{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.src-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.src-lbl{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase}
.card-name{font-size:16px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name.done{text-decoration:line-through;color:#bbb}
.card-addr{font-size:11px;color:#bbb;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* D-day 뱃지 */
.dday{
  flex-shrink:0;
  padding:7px 12px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
}
.dday-t{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;line-height:1}

/* 태그 */
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{
  display:flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:8px;
  font-size:11px;font-weight:700;
  border:1px solid transparent;
}
.tag .material-symbols-outlined{font-size:13px}

/* 구분선 */
.div{height:1px;background:#f0f0f0;margin-bottom:10px}

/* 날짜 정보 */
.date-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.date-lbl{font-size:12px;color:#bbb}
.date-val{font-size:12px;font-weight:600;color:#1a1c1e}

/* 진행바 */
.prog{height:4px;border-radius:99px;background:#f0f0f0;overflow:hidden;margin-bottom:10px}
.prog-f{height:100%;border-radius:99px}

/* 예약 마감 행 */
.book-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.book-lbl{font-size:12px;font-weight:600}
.book-lbl.red{color:#ba1a1a}
.book-lbl.ora{color:#b87c00}
.book-lbl.gray{color:#bbb}

/* 액션 버튼 */
.act-btn{
  padding:8px 18px;border-radius:99px;
  font-size:13px;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  border:1.5px solid transparent;cursor:pointer;
}

/* 자동 삭제 */
.auto-del{font-size:11px;color:#bbb;text-align:right;margin-top:6px}

/* 상태 칩 */
.chip{
  display:inline-flex;align-items:center;
  padding:4px 11px;border-radius:99px;
  font-size:10px;font-weight:700;margin-top:8px;
}

/* FAB */
#fab{
  position:fixed;bottom:26px;right:20px;
  width:58px;height:58px;border-radius:18px;
  background:#1a1c1e;color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:100;
  transform:translateZ(0);
}
#fab:active{opacity:0.8}
#fab .material-symbols-outlined{font-size:28px}

/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:#bbb}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:600;color:#999;margin-bottom:4px}
.empty-s{font-size:13px;line-height:1.6}

/* 푸터 */
.footer-note{
  text-align:center;padding:24px 20px 8px;
}
.footer-note span{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;padding:8px 16px;border-radius:16px;
  font-size:11px;color:#999;border:1px solid #eee;
}
.footer-note .material-symbols-outlined{font-size:14px;color:#0050cb}

/* 모달 */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,0.35);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity 0.18s;
}
.ov.open{opacity:1;pointer-events:all}
.sheet{
  width:100%;background:#eef0f7;
  border-radius:24px 24px 0 0;
  padding:0 20px 52px;
  max-height:88dvh;overflow-y:auto;
  transform:translateY(28px);
  transition:transform 0.24s cubic-bezier(0.34,1.1,0.64,1);
}
.ov.open .sheet{transform:translateY(0)}
.handle{width:32px;height:3px;background:#dde0ef;border-radius:99px;margin:12px auto 20px}
.sheet-title{font-size:20px;font-weight:900;margin-bottom:22px;letter-spacing:-0.3px}
.flbl{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#999;margin-bottom:7px}
.fsec{margin-bottom:18px}
.finput{
  width:100%;background:#fff;
  border:1px solid #dde0ef;border-radius:12px;
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;padding:13px 14px;
  outline:none;color:#1a1c1e;
  -webkit-appearance:none;
  transition:border-color 0.12s;
}
.finput:focus{border-color:#1a1c1e}
.fsub{font-size:11px;color:#bbb;margin-top:6px}
.parse-st{font-size:12px;min-height:18px;margin-top:7px;display:flex;align-items:center;gap:6px}
.parse-st .material-symbols-outlined{font-size:14px}
.btn-main{
  width:100%;padding:15px;border-radius:12px;border:none;
  background:#1a1c1e;color:#fff;
  font-family:'Noto Sans KR',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;
  -webkit-appearance:none;transition:opacity 0.12s;margin-top:4px;
}
.btn-main:disabled{opacity:0.3}
.btn-ghost{
  width:100%;padding:13px;border-radius:12px;
  border:1px solid #dde0ef;background:transparent;
  color:#999;font-family:'Noto Sans KR',sans-serif;
  font-size:14px;cursor:pointer;margin-top:8px;
  -webkit-appearance:none;
}

/* 토스트 */
#toast{
  position:fixed;bottom:94px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:#1a1c1e;color:#fff;
  padding:9px 18px;border-radius:99px;
  font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:all 0.16s;
  z-index:999;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.spin{display:inline-block;width:11px;height:11px;border:1.5px solid rgba(0,0,0,0.12);border-top-color:#555;border-radius:50%;animation:rot 0.6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.psrc-btn {
  padding:10px 6px;border-radius:10px;
  border:1.5px solid #dde0ef;background:#fff;
  color:#999;font-family:'Noto Sans KR',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;
  transition:all 0.12s;
}
.psrc-btn.on-super{border-color:#0050cb;background:rgba(0,80,203,0.07);color:#0050cb}
.psrc-btn.on-revu {border-color:#006c49;background:rgba(0,108,73,0.07);color:#006c49}
.psrc-btn.on-dinner{border-color:#b40036;background:rgba(180,0,54,0.07);color:#b40036}
</style>
</head>
<body>

<div id="vp">
  <!-- 헤더 -->
  <div id="hdr">
    <h1>체험단<span>.</span></h1>
    <div class="sum">
      <div class="sum-item"><span class="sum-n" id="sA">0</span><span class="sum-l">진행 중</span></div>
      <div class="sum-item"><span class="sum-n" id="sB">0</span><span class="sum-l blue">예약 필요</span></div>
      <div class="sum-item"><span class="sum-n gray" id="sD">0</span><span class="sum-l">완료</span></div>
    </div>
  </div>

  <!-- 필터 -->
  <div id="filters">
    <div class="filter-row no-scroll">
      <button class="fc on" onclick="setF('all',this)">전체</button>
      <button class="fc" onclick="setF('super',this)">슈퍼멤버스</button>
      <button class="fc" onclick="setF('revu',this)">레뷰</button>
      <button class="fc" onclick="setF('dinner',this)">디너의여왕</button>
    </div>
  </div>

  <!-- 카드 -->
  <div id="list"></div>
  <div id="footer" style="display:none" class="footer-note">
    <span><span class="material-symbols-outlined">info</span>완료 후 3일이 지나면 자동 삭제됩니다</span>
  </div>
</div>

<button id="fab" onclick="openAdd()"><span class="material-symbols-outlined">add</span></button>
<div id="toast"></div>

<!-- 추가 모달 -->
<div class="ov" id="addModal" onclick="bgClose(event,'addModal')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">체험 추가</div>
    <div class="fsec">
      <div class="flbl">캠페인 링크</div>
      <input class="finput" id="urlIn" type="url" placeholder="https://" onpaste="onPaste()">
      <div class="fsub">카카오톡에서 받은 캠페인 링크를 붙여넣으세요</div>
      <div id="pSt" style="font-size:12px;min-height:20px;margin-top:8px;display:flex;align-items:center;gap:6px"></div>
    </div>
    <button class="btn-main" id="subBtn" onclick="doAdd()" disabled style="opacity:0.3">추가하기</button>
    <button class="btn-ghost" onclick="closeModal('addModal')">취소</button>
  </div>
</div></div>

<script>
const SRC = {super:'슈퍼멤버스',revu:'레뷰',dinner:'디너의여왕'};
const SC = {
  super:{c:'#0050cb',bg:'rgba(0,80,203,0.08)'},
  revu: {c:'#006c49',bg:'rgba(0,108,73,0.08)'},
  dinner:{c:'#b40036',bg:'rgba(180,0,54,0.08)'},
};
const DD = {
  red: {bg:'#0050cb',c:'#fff'},
  ora: {bg:'rgba(0,80,203,0.1)',c:'#0050cb'},
  grn: {bg:'rgba(0,108,73,0.1)',c:'#006c49'},
  gray:{bg:'#f0f0f0',c:'#bbb'},
};

let items=[],filt='all';
const tod=()=>new Date().toISOString().slice(0,10);
function diff(ds){const n=new Date();n.setHours(0,0,0,0);return Math.round((new Date(ds+'T00:00:00')-n)/86400000)}
function fd(ds){if(!ds)return'-';const d=new Date(ds+'T00:00:00');return`${d.getMonth()+1}/${d.getDate()}`}
function bdl(it){if(!it.bookDays)return null;const d=new Date(it.deadline+'T00:00:00');d.setDate(d.getDate()-it.bookDays);return d.toISOString().slice(0,10)}
function dcls(d,s){if(s==='done')return'gray';if(d<=3)return'red';if(d<=7)return'ora';return'grn'}
function pct(it){
  if(it.status==='done')return 100;
  const c=new Date(it.createdAt+'T00:00:00'),dl=new Date(it.deadline+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);
  const t=dl-c;if(t<=0)return 100;
  return Math.min(100,Math.max(0,Math.round(((n-c)/t)*100)));
}

async function load(){
  try{const r=await window.storage.get('itm5');if(r&&r.value)items=JSON.parse(r.value);else{items=[];await save();}}
  catch{items=[];await save();}
}
async function save(){try{await window.storage.set('itm5',JSON.stringify(items));}catch{}}

function demo(){
  const a=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  return[
    {id:1,source:'super',name:'강남 모던 이자카야',addr:'서울 강남구 역삼동',deadline:a(2),bookDays:2,weekend:false,status:'pre',createdAt:a(-7),doneAt:null},
    {id:2,source:'revu',name:'성수 브런치 카페 봄날',addr:'서울 성동구 성수동',deadline:a(7),bookDays:1,weekend:true,status:'review',createdAt:a(-5),doneAt:null},
    {id:3,source:'dinner',name:'이태원 파스타 Onda',addr:'서울 용산구 이태원동',deadline:a(-3),bookDays:2,weekend:true,status:'done',createdAt:a(-20),doneAt:a(-1)},
  ];
}

function autoDel(){
  const b=items.length;
  items=items.filter(i=>!(i.status==='done'&&i.doneAt&&diff(i.doneAt)<-3));
  if(items.length<b)save();
}

function getList(){
  let l=[...items];
  if(filt==='super')l=l.filter(i=>i.source==='super');
  if(filt==='revu')l=l.filter(i=>i.source==='revu');
  if(filt==='dinner')l=l.filter(i=>i.source==='dinner');
  return l.sort((a,b)=>{
    if(a.status==='done'&&b.status!=='done')return 1;
    if(a.status!=='done'&&b.status==='done')return-1;
    return a.deadline.localeCompare(b.deadline);
  });
}

function render(){
  // 요약
  const act=items.filter(i=>i.status!=='done');
  const nb=act.filter(i=>{const b=bdl(i);return b&&diff(b)<=2}).length;
  document.getElementById('sA').textContent=act.length;
  document.getElementById('sB').textContent=nb;
  document.getElementById('sD').textContent=items.filter(i=>i.status==='done').length;

  const list=getList();
  const area=document.getElementById('list');
  const hasDone=list.some(i=>i.status==='done');
  document.getElementById('footer').style.display=hasDone?'block':'none';

  if(!list.length){
    area.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-t">항목이 없습니다</div><div class="empty-s">+ 버튼으로 체험을 추가하세요</div></div>`;
    return;
  }

  area.innerHTML=list.map(it=>{
    const d=diff(it.deadline),cls=dcls(d,it.status),ds=DD[cls],sc=SC[it.source];
    const p=pct(it),isDone=it.status==='done';
    const bd=bdl(it),bdf=bd?diff(bd):null;

    const ddT=isDone?'DONE':d<0?`D+${Math.abs(d)}`:d===0?'D-day':`D-${d}`;

    const wTag=it.weekend===true
      ?`<div class="tag" style="background:rgba(0,108,73,0.06);color:#006c49;border-color:rgba(0,108,73,0.15)"><span class="material-symbols-outlined">event_available</span>주말 가능</div>`
      :it.weekend===false
        ?`<div class="tag" style="background:rgba(186,26,26,0.05);color:#ba1a1a;border-color:rgba(186,26,26,0.12)"><span class="material-symbols-outlined">calendar_today</span>주말 불가</div>`:'';
    const bTag=it.bookDays>0?`<div class="tag" style="background:#f5f5f5;color:#888;border-color:#eee"><span class="material-symbols-outlined">schedule</span>${it.bookDays}일 전 예약</div>`:'';

    const stLabel={pre:'예약 전',review:'리뷰 전',done:'완료'}[it.status];
    const stStyle=it.status==='done'?'background:#eaf7f2;color:#006c49'
      :it.status==='review'?'background:#ebf4ff;color:#0050cb'
      :'background:#f0f0ea;color:#777';

    let bookHtml='';
    if(bd&&!isDone){
      const bcls=bdf<=0?'red':bdf<=2?'ora':'gray';
      const btxt=bdf<=0?'예약 마감: 기한 초과':bdf===0?'예약 마감: 오늘까지':`예약 마감: ${fd(bd)} (${bdf}일)`;
      bookHtml=`<div class="book-row">
        <span class="book-lbl ${bcls}">${btxt}</span>
        ${bdf<=2?`<button class="act-btn" style="background:#0050cb;color:#fff;border-color:#0050cb" onclick="event.stopPropagation();showToast('예약 페이지로 이동합니다')">예약하기</button>`:''}
      </div>`;
    }

    const revBtn=!isDone&&it.status==='review'
      ?`<div style="text-align:right;margin-top:8px"><button class="act-btn" style="color:#006c49;border-color:rgba(0,108,73,0.3);background:rgba(0,108,73,0.04)" onclick="event.stopPropagation();setSt(${it.id},'done')">리뷰 완료</button></div>`:'';

    const autoD=isDone&&it.doneAt
      ?`<div class="auto-del">${Math.max(0,3+diff(it.doneAt))}일 후 자동 삭제</div>`:'';

    const swBtns=`
      <button class="sw-btn" style="background:#f0f0ea;color:#666" onclick="setSt(${it.id},'pre')"><span class="material-symbols-outlined" style="font-size:18px">bookmark</span>예약 전</button>
      <button class="sw-btn" style="background:#ebf4ff;color:#0050cb" onclick="setSt(${it.id},'review')"><span class="material-symbols-outlined" style="font-size:18px">edit_note</span>리뷰 전</button>
      <button class="sw-btn" style="background:#eaf7f2;color:#006c49" onclick="setSt(${it.id},'done')"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>완료</button>
      <button class="sw-btn" style="background:#fff0f0;color:#ba1a1a" onclick="delIt(${it.id})"><span class="material-symbols-outlined" style="font-size:18px">delete</span>삭제</button>`;

    return`<div class="sw" id="sw${it.id}">
      <div class="sw-acts">${swBtns}</div>
      <div class="card${isDone?' dim':''}" data-id="${it.id}">
        <div class="card-top">
          <div class="thumb"><span class="material-symbols-outlined">restaurant</span></div>
          <div class="card-info">
            <div class="card-src">
              <span class="src-dot" style="background:${sc.c}"></span>
              <span class="src-lbl" style="color:${sc.c}">${SRC[it.source]}</span>
            </div>
            <div class="card-name${isDone?' done':''}">${it.name}</div>
            ${it.addr?`<div class="card-addr">${it.addr}</div>`:''}
            <span class="chip" style="${stStyle}">${stLabel}</span>
          </div>
          <div class="dday" style="background:${ds.bg}">
            <span class="dday-t" style="color:${ds.c}">${ddT}</span>
          </div>
        </div>
        ${wTag||bTag?`<div class="tags">${wTag}${bTag}</div>`:''}
        <div class="div"></div>
        <div class="date-row">
          <span class="date-lbl">리뷰 마감</span>
          <span class="date-val">${fd(it.deadline)}${!isDone?` (${d>=0?d+'일 남음':'초과'})`:''}</span>
        </div>
        ${!isDone?`<div class="prog"><div class="prog-f" style="width:${p}%;background:#0050cb"></div></div>`:''}
        ${bookHtml}${revBtn}${autoD}
      </div>
    </div>`;
  }).join('');

  swipe();
}

// ── 스와이프 (passive + rAF) ──
function swipe(){
  document.querySelectorAll('.card[data-id]').forEach(card=>{
    const wrap=card.closest('.sw');
    const acts=wrap.querySelector('.sw-acts');
    const MAX=66*4;
    let sx=0,sy=0,dx=0,drag=false,raf=null;

    card.addEventListener('touchstart',e=>{
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;drag=false;
    },{passive:true});

    card.addEventListener('touchmove',e=>{
      const t=e.touches[0];
      const cx=t.clientX-sx,cy=t.clientY-sy;
      if(!drag){
        if(Math.abs(cy)>Math.abs(cx)+5)return;
        if(Math.abs(cx)>6)drag=true;else return;
      }
      e.preventDefault();
      dx=Math.max(-MAX,Math.min(0,cx));
      if(raf)return;
      raf=requestAnimationFrame(()=>{
        card.style.transform=`translateX(${dx}px)`;
        acts.style.opacity=Math.min(1,-dx/60)+'';
        raf=null;
      });
    },{passive:false});

    card.addEventListener('touchend',()=>{
      if(!drag)return;
      if(raf){cancelAnimationFrame(raf);raf=null;}
      dx<-MAX*0.35?snapO(card,wrap,acts,MAX):snapC(card,wrap,acts);
      drag=false;
    },{passive:true});
  });

  document.addEventListener('touchstart',e=>{
    document.querySelectorAll('.sw.open').forEach(w=>{
      if(!w.contains(e.target))snapC(w.querySelector('.card'),w,w.querySelector('.sw-acts'));
    });
  },{passive:true});
}

function snapO(card,wrap,acts,max){
  card.style.transition='transform 0.2s ease';
  card.style.transform=`translateX(-${max}px)`;
  acts.style.opacity='1';wrap.classList.add('open');
  document.querySelectorAll('.sw.open').forEach(w=>{if(w!==wrap)snapC(w.querySelector('.card'),w,w.querySelector('.sw-acts'));});
  setTimeout(()=>card.style.transition='',220);
}
function snapC(card,wrap,acts){
  card.style.transition='transform 0.2s ease';
  card.style.transform='translateX(0)';
  acts.style.opacity='0';wrap.classList.remove('open');
  setTimeout(()=>card.style.transition='',220);
}

// ── 필터 ──
function setF(f,el){
  filt=f;
  document.querySelectorAll('.fc').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');

// ── 상태/삭제 ──
async function setSt(id,st){
  const it=items.find(i=>i.id===id);if(!it)return;
  it.status=st;
  if(st==='done')it.doneAt=tod();else delete it.doneAt;
  await save();render();
  showToast({pre:'예약 전',review:'리뷰 전',done:'완료'}[st]+'으로 변경했습니다');
}
async function delIt(id){items=items.filter(i=>i.id!==id);await save();render();showToast('삭제했습니다')}

// ── 헤더 숨김 (rAF throttle) ──
const vp=document.getElementById('vp'),hdr=document.getElementById('hdr');
let ly=0,tick=false;
vp.addEventListener('scroll',()=>{
  if(tick)return;tick=true;
  requestAnimationFrame(()=>{
    const y=vp.scrollTop;
    if(y>ly&&y>60)hdr.classList.add('up');
    else if(y<ly)hdr.classList.remove('up');
    ly=y;tick=false;
  });
},{passive:true});

// ── 추가 ──
function openAdd(){
  document.getElementById('urlIn').value='';
  document.getElementById('pSt').innerHTML='';
  document.getElementById('subBtn').disabled=true;
  document.getElementById('subBtn').style.opacity='0.3';
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('urlIn').focus(),280);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function bgClose(e,id){ if(e.target===e.currentTarget) closeModal(id); }

function setPSt(t,m){
  const el=document.getElementById('pSt');
  if(t==='load') el.innerHTML='<span class="spin"></span><span style="color:#bbb">읽는 중...</span>';
  else if(t==='ok') el.innerHTML='<span class="material-symbols-outlined" style="color:#006c49;font-size:14px">check_circle</span><span style="color:#006c49;font-weight:600">'+m+'</span>';
  else if(t==='err') el.innerHTML='<span style="color:#f90;font-size:11px">'+m+'</span>';
  else el.innerHTML='';
}

function onPaste(){
  setTimeout(()=>{
    const u=document.getElementById('urlIn').value.trim();
    if(u) callWorker(u);
  }, 60);
}

let parsedData = null;

async function callWorker(url){
  setPSt('load','');
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch('https://cheheomdan-parser.llssee0205.workers.dev',{
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})
    });
    clearTimeout(timer);
    const p=await r.json();
    if(p.error) throw new Error(p.error);
    parsedData=p;
    const s=SRC[p.source]||'플랫폼 미확인';
    const nameStr=p.name?(' · '+p.name):'';
    setPSt('ok', s+nameStr);
    document.getElementById('subBtn').disabled=false;
    document.getElementById('subBtn').style.opacity='1';
  }catch(e){
    setPSt('err','읽기 실패 — 다시 시도해주세요');
  }
}

async function doAdd(){
  const url=document.getElementById('urlIn').value.trim();
  if(!url||!parsedData) return;
  const p=parsedData;
  const src=['super','revu','dinner'].includes(p.source)?p.source:'revu';
  const dl=p.deadline||(()=>{const d=new Date();d.setDate(d.getDate()+14);return d.toISOString().slice(0,10)})();
  items.unshift({
    id:Date.now(), source:src, name:p.name||url,
    addr:p.addr||'', deadline:dl,
    bookDays:p.bookDays||0, weekend:p.weekend??null,
    status:'pre', createdAt:tod(), doneAt:null, link:url,
  });
  await save(); render(); closeModal('addModal'); showToast('추가했습니다');
}

// ── 토스트 ──
let tT;
function showToast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2000);}

(async()=>{await load();autoDel();render();})();
</script>
